name: Extension builds upload

on:
  push:
    branches: [main]
    paths:
      - "tools/modetour-extractor-extension/**"
      - "tools/thealltour_extension/**"
      - "public/extension-builds/**"
      - "scripts/upload-extension-builds.mjs"
      - ".github/workflows/extension-builds.yml"
  workflow_dispatch:

jobs:
  package-and-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install root dependencies (upload script)
        run: npm ci

      - name: Package modetour extension
        working-directory: tools/modetour-extractor-extension
        run: |
          npm ci
          npm run package

      - name: Package thealltour extension
        working-directory: tools/thealltour_extension
        run: |
          npm run package

      - name: Verify committed thealltour-extension download zip
        run: |
          node -e "const fs=require('fs'); const pkg=JSON.parse(fs.readFileSync('tools/thealltour_extension/package.json','utf8')); const man=JSON.parse(fs.readFileSync('public/extension-builds/thealltour-extension/manifest.json','utf8')); if (pkg.version!==man.version) { throw new Error('Committed download is v'+man.version+' but source is v'+pkg.version+'. Run npm run extensions:package:local -- --slug=thealltour-extension and commit public/extension-builds.'); } const zip=fs.statSync('public/extension-builds/thealltour-extension/latest.zip'); if (!zip.size) throw new Error('latest.zip is empty'); console.log('ok committed thealltour-extension v'+man.version+' ('+zip.size+' bytes)');"

      - name: Upload to Supabase Storage
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/upload-extension-builds.mjs --skip-package
