<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1e3a5f" />
    <title>오프라인 · 더올투어 관리</title>
    <style>
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family: system-ui, -apple-system, sans-serif;
        background: #f8fafc;
        color: #0f172a;
        padding: 1.5rem;
        box-sizing: border-box;
      }
      .card {
        max-width: 22rem;
        width: 100%;
        border: 1px solid #e2e8f0;
        border-radius: 1rem;
        background: #fff;
        padding: 1.25rem 1.5rem;
        box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      }
      h1 {
        margin: 0 0 0.5rem;
        font-size: 1.125rem;
      }
      p {
        margin: 0;
        font-size: 0.875rem;
        line-height: 1.5;
        color: #64748b;
      }
      a {
        display: inline-block;
        margin-top: 1rem;
        font-size: 0.875rem;
        font-weight: 600;
        color: #1e3a5f;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>네트워크에 연결해 주세요</h1>
      <p>
        관리자 앱은 최신 데이터 조회를 위해 인터넷 연결이 필요합니다. 연결 후 다시 시도해 주세요.
      </p>
      <a href="/theall_manager_only/pwa">허브로 돌아가기</a>
    </div>
  </body>
</html>
